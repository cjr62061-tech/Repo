name: Make PDF
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install fpdf
      - run: python main.py
      - uses: actions/upload-artifact@v3
        with:
          name: chemistry-pdf
          path: chemistry_formulas.pdf